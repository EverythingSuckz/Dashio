name: Release

# Pushing a tag such as v0.1.0 builds the installer and publishes it as a release.
# Running it by hand builds the installer only, to try the build without releasing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "The tag is $env:GITHUB_REF_NAME but Directory.Build.props says $version. Change one of them."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # Only the tests that need nothing from the machine, as in CI.
      - name: Test
        run: dotnet test tests/Dashio.Core.Tests -c Release --filter "Category!=Live&Category!=Integration&Category!=Report"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: ./tools/publish.ps1

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: artifacts/Dashio-Setup-${{ steps.version.outputs.version }}-x64.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    env:
      HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download the installer
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Write the checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt

      - name: Write the release notes
        id: notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            RANGE="$CURRENT_TAG"
          else
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
          fi

          FEATURES=""
          FIXES=""
          OTHER=""
          # The last line of the log has no line break, and would be skipped without the second test.
          while IFS= read -r line || [ -n "$line" ]; do
            hash=$(echo "$line" | cut -d' ' -f1)
            msg=$(echo "$line" | cut -d' ' -f2-)
            clean=$(echo "$msg" | sed 's/^[a-z]*[^:]*: *//')
            clean="$(echo "${clean:0:1}" | tr '[:lower:]' '[:upper:]')${clean:1}"
            case "$msg" in
              feat:*|feat\(*) FEATURES="${FEATURES}- \`${hash}\` ${clean}\n" ;;
              fix:*|fix\(*) FIXES="${FIXES}- \`${hash}\` ${clean}\n" ;;
              *) OTHER="${OTHER}- \`${hash}\` ${clean}\n" ;;
            esac
          done < <(git log "$RANGE" --pretty=format:"%h %s" --reverse)

          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${CURRENT_TAG}"
          SETUP="Dashio-Setup-${VERSION}-x64.exe"

          BODY="## Download\n\n"
          BODY+="| | |\n|---|---|\n"
          BODY+="| Installer for Windows 11 (x64) | [${SETUP}](${BASE_URL}/${SETUP}) |\n"
          BODY+="| Checksums | [SHA256SUMS.txt](${BASE_URL}/SHA256SUMS.txt) |\n\n"
          BODY+="The installer is not signed yet, so Windows SmartScreen says \"Windows protected your PC\" the first time. "
          BODY+="Choose **More info**, then **Run anyway**. It was built from this tag by the "
          BODY+="[release workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).\n\n"
          BODY+="Nothing else needs installing: .NET and the Windows App SDK are included.\n\n---\n\n"

          if [ -n "$FEATURES" ] || [ -n "$FIXES" ] || [ -n "$OTHER" ]; then
            BODY="${BODY}## Changes\n\n"
          fi
          if [ -n "$FEATURES" ]; then
            BODY="${BODY}### Features\n${FEATURES}\n"
          fi
          if [ -n "$FIXES" ]; then
            BODY="${BODY}### Fixes\n${FIXES}\n"
          fi
          if [ -n "$OTHER" ]; then
            BODY="${BODY}### Other\n${OTHER}\n"
          fi

          {
            echo "body<<EOF"
            echo -e "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Only when the repository has the key: detached signatures to check the downloads against.
      - name: Import the GPG key
        if: env.HAS_GPG_KEY == 'true'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign the files
        if: env.HAS_GPG_KEY == 'true'
        run: |
          for file in artifacts/*; do
            [ -f "$file" ] || continue
            gpg --batch --yes --detach-sign --armor "$file"
          done

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          name: Dashio ${{ needs.build.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          # Versions before 1.0 are marked as pre-releases.
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          files: |
            artifacts/*
