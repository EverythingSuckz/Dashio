name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Dashio.slnx -c Release

      # Only the tests that need nothing from the machine. The live, integration and UI tests
      # read or change the PC they run on, so they stay on a developer's own.
      - name: Test
        run: dotnet test tests/Dashio.Core.Tests -c Release --no-build --filter "Category!=Live&Category!=Integration&Category!=Report"
