<svg xmlns="http://www.w3.org/2000/svg" width="164" height="314" viewBox="0 0 164 314">
  <title>The panel on the first and last page of the Dashio installer</title>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="164" y2="314" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3F9FF"/>
      <stop offset="1" stop-color="#D9E9FA"/>
    </linearGradient>
    <linearGradient id="tiles" x1="0" y1="190" x2="164" y2="314" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34E0C2"/>
      <stop offset="1" stop-color="#0B57C2"/>
    </linearGradient>
    <linearGradient id="body" x1="40" y1="32" x2="216" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34E0C2"/>
      <stop offset=".5" stop-color="#12A6D8"/>
      <stop offset="1" stop-color="#0B57C2"/>
    </linearGradient>
    <linearGradient id="inner" x1="76" y1="68" x2="180" y2="188" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".08"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#063A7A" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="164" height="314" fill="url(#back)"/>
  <g fill="url(#tiles)">
    <rect x="14" y="196" width="62" height="104" rx="10" fill-opacity=".9"/>
    <rect x="84" y="196" width="66" height="46" rx="10" fill-opacity=".55"/>
    <rect x="84" y="250" width="30" height="50" rx="9" fill-opacity=".75"/>
    <rect x="120" y="250" width="30" height="50" rx="9" fill-opacity=".35"/>
  </g>
  <rect x="26" y="210" width="38" height="6" rx="3" fill="#fff" fill-opacity=".9"/>
  <rect x="26" y="222" width="24" height="6" rx="3" fill="#fff" fill-opacity=".55"/>
  <g transform="translate(46 44) scale(.28125)">
    <path d="M64 28h52a100 100 0 0 1 0 200H64a28 28 0 0 1-28-28V56a28 28 0 0 1 28-28z" fill="url(#body)"/>
    <path d="M82 68h34a60 60 0 0 1 0 120H82a10 10 0 0 1-10-10V78a10 10 0 0 1 10-10z" fill="url(#inner)"/>
    <path d="M20 132h50l18-40 30 82 22-56 14 14h50" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" filter="url(#lift)"/>
  </g>
  <text x="82" y="144" text-anchor="middle" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-weight="600" font-size="22" fill="#14233B">Dashio</text>
</svg>
